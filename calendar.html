const KST=()=>{const n=new Date();return new Date(n.getTime()+(n.getTimezoneOffset()+540)*60000)};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const WD=['일','월','화','수','목','금','토'];
let mode=localStorage.gfMode||'w', cur=KST(); cur.setHours(0,0,0,0); const todayS=iso(KST());
function monday(d){const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function render(){const cal=document.getElementById('cal');cal.className='grid '+mode;cal.innerHTML='';
 document.getElementById('wk').classList.toggle('on',mode==='w');document.getElementById('mo').classList.toggle('on',mode==='m');
 let start,days;if(mode==='w'){start=monday(cur);days=7;const e=new Date(start);e.setDate(e.getDate()+6);
  document.getElementById('title').textContent=`${start.getFullYear()}년 ${start.getMonth()+1}월 ${start.getDate()}일 – ${e.getMonth()+1}월 ${e.getDate()}일`}
 else{const f=new Date(cur.getFullYear(),cur.getMonth(),1);start=monday(f);days=42;document.getElementById('title').textContent=`${cur.getFullYear()}년 ${cur.getMonth()+1}월`}
 for(let i=0;i<7;i++){const d=new Date(start);d.setDate(d.getDate()+i);const h=document.createElement('div');h.className='hd'+(mode==='w'&&iso(d)===todayS?' today':'');
  h.innerHTML=WD[d.getDay()]+(mode==='w'?`<b>${d.getDate()}</b>`:'');cal.appendChild(h)}
 for(let i=0;i<days;i++){const d=new Date(start);d.setDate(d.getDate()+i);const s=iso(d);const c=document.createElement('div');
  c.className='cell'+(s===todayS?' today':'')+(mode==='m'&&d.getMonth()!==cur.getMonth()?' dim':'');
  if(mode==='m')c.innerHTML=`<div class="d">${d.getDate()===1?(d.getMonth()+1)+'월 ':''}${d.getDate()}</div>`;
  (byDay[s]||[]).forEach(e=>{const v=document.createElement('div');v.className='ev '+e.c+(e.t?'':' all');
   v.innerHTML=`<i></i>${e.t?`<span class="t">${e.t}</span>`:''}<span>[${e.g}] ${e.ev}</span>`;v.title=e.ev;v.onclick=()=>pop(e);c.appendChild(v)});
  cal.appendChild(c)}}
function pop(e){const b=document.getElementById('popbox');b.innerHTML=`<h3><span class="g ${e.c}">${e.g}</span> ${e.ev}</h3>
 <div>${e.d} ${e.t||'종일'} KST · ${e.te||'all day'} ET</div><div>차단 창: ${e.w||'-'}</div><div>가족: ${e.fam}</div>${e.n?`<div class="muted">${e.n}</div>`:''}
 <div style="margin-top:8px"><a href="events/${e.s}.html">과거 영향 분석 →</a>${e.src?` · <a href="${e.src}">공식 출처</a>`:''}</div>
 <div style="text-align:right;margin-top:8px"><button onclick="document.getElementById('pop').style.display='none'">닫기</button></div>`;
 document.getElementById('pop').style.display='flex'}
document.getElementById('pop').onclick=ev=>{if(ev.target.id==='pop')ev.target.style.display='none'};
document.getElementById('prev').onclick=()=>{mode==='w'?cur.setDate(cur.getDate()-7):cur.setMonth(cur.getMonth()-1);render()};
document.getElementById('next').onclick=()=>{mode==='w'?cur.setDate(cur.getDate()+7):cur.setMonth(cur.getMonth()+1);render()};
document.getElementById('today').onclick=()=>{cur=KST();cur.setHours(0,0,0,0);render()};
document.getElementById('wk').onclick=()=>{mode='w';localStorage.gfMode='w';render()};document.getElementById('mo').onclick=()=>{mode='m';localStorage.gfMode='m';render()};
const ig=document.getElementById('showIgn');ig.checked=localStorage.gfIgn==='1';document.body.classList.toggle('hide-ign',!ig.checked);
ig.onchange=()=>{localStorage.gfIgn=ig.checked?'1':'0';document.body.classList.toggle('hide-ign',!ig.checked)};
render();
</script></body></html>
